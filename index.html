<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>ذا كلينر — The Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: white app canvas, one blue hero on Home, glass used only for floating chrome
   (tab bar, action bar, headers, sheets, hero pills). Forms and cards stay solid for legibility. */
:root{
  --blue:#1458F0;--blue-d:#0B42C4;--blue-50:#EEF3FF;--blue-100:#DDE7FF;--blue-200:#BFD3FF;
  --ink:#0B1630;--ink-2:#36435E;--muted:#5D6B86;--line:#E3E9F3;--surface:#F4F7FC;--bg:#FFFFFF;
  --ok:#0E8A44;--ok-50:#E6F6ED;--warn:#8A5700;--warn-50:#FFF4DE;--err:#C42F39;--err-50:#FDECEE;
  /* Liquid Glass tokens — replaced by opaque values in the fallbacks below */
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.86);--glass-line:rgba(255,255,255,.8);
  --glass-edge:rgba(11,22,48,.09);--glass-shadow:0 12px 32px rgba(16,38,92,.14),0 1px 3px rgba(16,38,92,.08);
  --glass-tint:rgba(20,88,240,.12);--blur:blur(22px) saturate(180%);
  --scrim:rgba(11,22,48,.28);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--dx:1;
}
[dir=rtl]{--dx:-1}
/* Opaque fallbacks: no backdrop-filter support, OS "Reduce transparency", or the prototype toggle */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
}
@media (prefers-reduced-transparency:reduce){
  :root{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
  .glass,.overlay{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
html.solid{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
html.solid .glass,html.solid .overlay{-webkit-backdrop-filter:none;backdrop-filter:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
svg{flex-shrink:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 .5px var(--glass-edge)}
.glass.strong{background:var(--glass-strong)}

#device{position:fixed;inset:0;top:var(--vv-top,0px);height:var(--app-h,100%);background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.sbar,.hbar{display:none}
.sbar{position:absolute;top:0;inset-inline:0;height:var(--sat);align-items:center;justify-content:space-between;padding:0 30px;font:600 15px/1 system-ui;z-index:60;pointer-events:none;direction:ltr;color:var(--ink);transition:color .3s}
.sbar.on-hero{color:#fff}
.sbar .island{width:120px;height:34px;border-radius:20px;background:#0B1630}
.sbar.no-notch .island{display:none}
.hbar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0B1630;z-index:60;pointer-events:none}
.hbar.hidden{display:none!important}
.top-scrim{position:absolute;top:0;inset-inline:0;height:calc(var(--sat) + 6px);z-index:20;border:0;border-radius:0;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 1px 0 var(--glass-edge)}
.top-scrim.show{opacity:1}
html.sim #device{--sat:54px;--sab:34px}
html.sim .sbar{display:flex}html.sim .hbar{display:block}
@media (min-width:600px) and (min-height:640px){
  body{background:#E6ECF6;display:flex;align-items:center;justify-content:center}
  #device{position:relative;inset:auto;top:auto;width:var(--fw,393px);height:var(--fh,852px);flex-shrink:0;border-radius:var(--frad,52px);
    box-shadow:0 0 0 11px #0B1630,0 40px 90px rgba(11,22,48,.35);--sat:var(--fsat,54px);--sab:var(--fsab,34px);transform:scale(var(--fscale,1))}
  .sbar{display:flex}.hbar{display:block}
}

/* ---------- layout ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.enter-f{animation:enterF .3s var(--ease)}
.enter-b{animation:enterB .3s var(--ease)}
.enter-u{animation:fadeUp .3s ease-out}
@keyframes enterF{from{opacity:0;transform:translateX(calc(24px * var(--dx)))}}
@keyframes enterB{from{opacity:0;transform:translateX(calc(-24px * var(--dx)))}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.sheet-b::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.with-tabbar{padding-bottom:calc(var(--sab) + 104px)}
.with-fbar{padding-bottom:calc(var(--sab) + 112px)}
.with-head{padding-top:calc(var(--sat) + 112px)}
.top-title{padding:calc(var(--sat) + 14px) 16px 4px}

/* ---------- type ---------- */
.h1{font-size:26px;font-weight:700;margin:6px 0 4px;line-height:1.3;letter-spacing:-.2px;text-wrap:balance}
.h2{font-size:17px;font-weight:700;margin:26px 0 12px;line-height:1.4;display:flex;align-items:center;gap:6px}
.h2 .opt{font-weight:400;font-size:13.5px;color:var(--muted)}
.sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.55}
[dir=ltr] .h1{letter-spacing:-.5px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;padding:0 20px;
  box-shadow:0 6px 16px rgba(20,88,240,.28),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .15s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97);background:var(--blue-d)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.sec{background:var(--blue-50);color:var(--blue);box-shadow:none}
.btn.line{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{min-height:44px;width:auto;font-size:14.5px;border-radius:14px;padding:0 16px}
.link{color:var(--blue);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .15s var(--ease)}
.circle:active{transform:scale(.92)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- generic ---------- */
.card{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(16,38,92,.04)}
.card.tint{background:var(--surface);border-color:transparent;box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ico{width:46px;height:46px;border-radius:15px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-50);color:var(--blue)}
.tag.warn{background:var(--warn-50);color:var(--warn)}
.tag.ok{background:var(--ok-50);color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);color:var(--ink-2);font-size:13.5px;line-height:1.6}
.note svg{margin-top:2px;color:var(--blue)}
.note.warn{background:var(--warn-50);color:#5E3D00}.note.warn svg{color:var(--warn)}
.note.err{background:var(--err-50);color:#7A1C22}.note.err svg{color:var(--err)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv>span:last-child{text-align:end;color:var(--ink);font-weight:500;overflow-wrap:anywhere}

/* ---------- Home ---------- */
.hero{position:relative;color:#fff;background:linear-gradient(160deg,#0D44D6 0%,#1458F0 55%,#3B7BFF 100%);padding:calc(var(--sat) + 10px) 16px 52px;overflow:hidden;isolation:isolate}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
[dir=ltr] .hero-art{transform:scaleX(-1)}
.hero-top{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;color:var(--ink);font-weight:600;font-size:14px;min-width:0;transition:transform .15s var(--ease)}
[dir=rtl] .pill{padding:0 6px 0 14px}
.pill:active{transform:scale(.97)}
.pill .dot{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.pill .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-copy{margin-top:30px;max-width:min(300px,64%)}
[dir=ltr] .hero-copy{max-width:56%}
[dir=ltr] .hero-copy h1{font-size:25px}
.hero-copy h1{font-size:28px;line-height:1.3;margin:10px 0 6px;font-weight:700;text-wrap:balance}
.hero-copy p{margin:0 0 18px;font-size:15px;opacity:.92;line-height:1.6}
.hero .demo{font-size:12px;font-weight:600;color:var(--warn);padding:5px 12px;min-height:30px;border-radius:999px;display:inline-flex;align-items:center}
.hero-cta{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;color:var(--blue);font-weight:700;font-size:15.5px;transition:transform .15s var(--ease)}
.hero-cta:active{transform:scale(.97)}
.main-sheet{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 16px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{font-size:18px;font-weight:700;margin:0}
.svc-feat{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:24px;border:1px solid var(--line);background:var(--bg);box-shadow:0 2px 10px rgba(16,38,92,.05);transition:transform .15s var(--ease)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.svc-card{display:flex;flex-direction:column;width:100%;padding:10px;border-radius:24px;border:1px solid var(--line);background:var(--bg);box-shadow:0 2px 10px rgba(16,38,92,.05);transition:transform .15s var(--ease)}
.svc-feat:active,.svc-card:active{transform:scale(.98)}
.art{position:relative;border-radius:18px;background:linear-gradient(145deg,var(--blue-50),var(--blue-100));color:var(--blue);display:grid;place-items:center;overflow:hidden}
.art::before,.art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.7)}
.art::before{width:38%;aspect-ratio:1;inset-inline-end:-8%;top:-12%}
.art::after{width:18%;aspect-ratio:1;inset-inline-start:10%;bottom:10%;background:rgba(255,255,255,.55)}
.art svg{position:relative;z-index:1}
.svc-feat .art{width:96px;height:96px;flex-shrink:0}
.svc-card .art{height:96px}
.svc-t{font-weight:700;font-size:16px;line-height:1.35}
.svc-d{color:var(--muted);font-size:13px;line-height:1.5;margin-top:3px}
.svc-card .body{padding:10px 4px 2px;display:flex;flex-direction:column;gap:6px;flex:1}
.svc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.go{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0}
.promo2{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:linear-gradient(120deg,#EAF1FF,#F6F9FF);border:1px solid var(--blue-100);width:100%}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.pkg{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:24px;border:1px solid var(--line);padding:16px;background:var(--bg)}
.pkg-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;border-radius:16px;background:var(--surface);padding:10px 4px;text-align:center}
.pkg-stats b{display:block;font-size:16px}
.pkg-stats span{font-size:11.5px;color:var(--muted)}
.pkg-stats>div+div{border-inline-start:1px solid var(--line)}
.active-order{display:block;width:100%;text-align:start;border-radius:24px;padding:16px;background:var(--ink);color:#fff;margin-bottom:14px}
.active-order .muted{color:#A9B6CE}
.mini-prog{display:flex;gap:4px;margin-top:14px}
.mini-prog i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.mini-prog i.on{background:#7FA6FF}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--blue-50);width:100%;min-height:58px;margin-bottom:12px}

/* floating glass tab bar */
.tabbar{position:absolute;inset-inline:14px;bottom:calc(var(--sab) + 10px);display:flex;gap:2px;padding:6px;border-radius:32px;z-index:30;animation:barIn .4s var(--ease)}
@keyframes barIn{from{transform:translateY(20px);opacity:0}}
.tabbar button{flex:1;min-height:54px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink-2);transition:background .25s,color .25s}
.tabbar button.on{background:var(--glass-tint);color:var(--blue);font-weight:700}
.tabbar button.on svg{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.14)}}

/* ---------- booking ---------- */
.bk-head{position:absolute;top:0;inset-inline:0;z-index:25;padding:calc(var(--sat) + 8px) 12px 10px;border-radius:0 0 22px 22px;border-top:0;display:flex;align-items:center;gap:10px}
.bk-head .ttl{flex:1;text-align:center;min-width:0}
.bk-head .ttl b{display:block;font-size:16.5px}
.bk-head .ttl span{font-size:12.5px;color:var(--muted)}
.bk-head .circle{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--glass-edge)}
.prog{display:flex;gap:5px;justify-content:center;margin-top:5px}
.prog i{width:18px;height:4px;border-radius:2px;background:var(--line);transition:all .3s}
.prog i.on{background:var(--blue);width:28px}
.fbar{position:absolute;inset-inline:12px;bottom:calc(var(--sab) + 10px);z-index:30;border-radius:30px;padding:8px;display:flex;align-items:center;gap:10px;animation:barIn .35s var(--ease)}
.fbar .est{flex:1;min-width:0;padding-inline-start:12px}
.fbar .est .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fbar .est .v{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .btn{width:auto;min-width:136px;border-radius:24px;min-height:52px}
.fbar.full .btn{flex:1}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);transition:border-color .2s,background .2s}
.choice.on{border-color:var(--blue);background:var(--blue-50)}
.choice .art{width:56px;height:56px;flex-shrink:0;border-radius:16px}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;transition:all .2s;background:var(--bg);flex-shrink:0;margin-top:2px}
.on>.check,.on .check{background:var(--blue);border-color:var(--blue)}
.detail{margin-top:10px;padding:14px;border-radius:18px;background:var(--bg);border:1px solid var(--blue-100);animation:fadeUp .3s ease-out}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.chip.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue);font-weight:600}
.chip:active{transform:scale(.97)}
.seg{display:flex;background:var(--surface);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(16,38,92,.12)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.stepper button:active{transform:scale(.92)}
.stepper button[disabled]{opacity:.35;pointer-events:none}
.stepper output{min-width:30px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.bags{display:flex;gap:4px;margin-top:10px;color:var(--blue);flex-wrap:wrap}
.item-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
.field{display:block}
.field label,.flabel{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.field .opt{color:var(--muted);font-weight:400}
.inp{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s;resize:none;line-height:1.5}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-50)}
.has-err .inp{border-color:var(--err)}
.err-msg{color:var(--err);font-size:13px;margin-top:8px;display:flex;align-items:center;gap:5px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.count{font-size:12px;color:var(--muted);text-align:end;margin-top:4px}
.toggle{width:52px;height:32px;border-radius:16px;background:#CBD3E1;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s var(--ease)}
.toggle.on{background:var(--blue)}
.toggle.on::after{inset-inline-start:23px}

/* location */
.map{position:relative;height:132px;border-radius:20px 20px 0 0;overflow:hidden;background:#EAF0F8}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);color:var(--blue);filter:drop-shadow(0 4px 6px rgba(20,88,240,.35));animation:drop .5s var(--ease)}
@keyframes drop{from{transform:translate(-50%,-160%);opacity:0}}
.map-cap{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11px;padding:3px 9px;border-radius:999px;color:var(--ink-2)}
.loc-card{border:1px solid var(--line);border-radius:20px;overflow:hidden}
.loc-card .addr-line{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.addr-chips{display:flex;gap:10px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.achip{flex:0 0 auto;min-width:112px;max-width:150px;min-height:78px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:all .18s}
.achip.on{border-color:var(--blue);background:var(--blue-50)}
.achip b{font-size:14px}.achip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.achip.add{border-style:dashed;border-color:#B9C8E2;color:var(--blue);align-items:center;justify-content:center;font-weight:600;font-size:13.5px}
.cal{border-radius:22px;background:var(--surface);padding:14px 12px 12px}

.day.on .w{color:#DCE6FF}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.slot{min-height:56px;border-radius:999px;background:var(--surface);padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:all .18s;border:1.5px solid transparent}
.slot .tm{font-weight:600;font-size:14.5px}
.slot .lf{font-size:11.5px;color:var(--muted)}
.slot.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(20,88,240,.28)}
.slot.on .lf{color:#DCE6FF}
.slot[disabled]{background:transparent;border-color:var(--line);color:#A3AEC2;pointer-events:none}

.skel{background:linear-gradient(90deg,#EAEFF6 25%,#F6F8FC 50%,#EAEFF6 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:999px}

.sum{padding:0}
.sum-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.sum-h b{font-size:15px}
.sum-b{padding:4px 16px 14px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.price{border-radius:22px;background:var(--surface);padding:16px}
.price .big{font-size:24px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--bg)}

.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}

.done-ring svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .25s forwards}
@keyframes ring{from{transform:scale(.4);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.tl-i{display:flex;gap:14px;position:relative;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-i.done::before{background:var(--blue)}
.tl-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:#fff;z-index:1;flex-shrink:0}
.tl-i.done .tl-dot{background:var(--blue);border-color:var(--blue)}
.tl-i.cur .tl-dot{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-50)}
.tl-i.cur .tl-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.tl-t{font-weight:600;font-size:15px;line-height:1.4}
.tl-i:not(.done):not(.cur) .tl-t{color:var(--muted);font-weight:500}
.tl-d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}

.empty .ico{margin:0 auto 14px;width:76px;height:76px;border-radius:26px}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.list{border:1px solid var(--line);border-radius:22px;overflow:hidden}
.list>button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:58px;border-bottom:1px solid var(--line);background:var(--bg)}
.list>*:last-child{border-bottom:0}
.li-ico{width:36px;height:36px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}

.overlay{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;animation:fade .25s;display:flex;align-items:flex-end;padding:0 8px calc(var(--sab) + 8px)}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:calc(100% - var(--sat) - 16px);border-radius:32px;display:flex;flex-direction:column;animation:up .36s var(--ease);overflow:hidden}
@keyframes up{from{transform:translateY(105%)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px 18px;position:relative}
[dir=rtl] .sheet-h{padding:8px 18px 4px 14px}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(11,22,48,.18)}
.sheet-h b{font-size:17px;padding-top:16px}

.sheet-b{overflow-y:auto;overflow-x:hidden;padding:8px 18px 16px;flex:1;min-height:0;overscroll-behavior:contain;scrollbar-width:none}
.sheet-f{padding:10px 14px 14px}

#toast{position:absolute;inset-inline:16px;top:calc(var(--sat) + 10px);z-index:80;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.t-msg{background:rgba(11,22,48,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(11,22,48,.25);animation:tIn .3s cubic-bezier(.2,1.2,.4,1);max-width:100%;line-height:1.5}

@keyframes tIn{from{transform:translateY(-16px);opacity:0}}
@keyframes tOut{to{transform:translateY(-16px);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

// ---- Toast -------------------------------------------------------------------
function toast(msg, kind='ok'){
  const root = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 't-msg ' + kind;
  el.innerHTML = (kind === 'ok' ? I('check',18) : kind === 'err' ? I('alert',18) : I('info',18)) + `<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260) }, 2600);
}

// Optional preferred delivery time — a REQUEST, not a confirmed slot (availability/turnaround unverified).
function deliveryDays(){
  const d = S.draft; if (!d.date) return [];
  const p = parseYmd(d.date), out = [];
  for (let i = 1; i <= 6; i++) out.push(new Date(p.getFullYear(), p.getMonth(), p.getDate() + i));
  return out;
}
function deliverySlots(key){
  const isFri = parseYmd(key).getDay() === 5;
  return SLOT_DEF.map(([a,b], i) => ({ id:`${a}-${b}`, left: (isFri && a < 13) ? 0 : (hash('d' + key + i) % 4 === 0 ? 0 : 2) }));
}
function deliveryBlock(){
  const d = S.draft, ed = T.errors.delivery;
  let h = `<h2 class="h2">${tx('موعد التسليم المفضّل','Preferred delivery time')} <span class="opt">(${tx('اختياري','optional')})</span></h2>
    <div class="seg" role="radiogroup">
      <button class="${d.deliveryMode==='later'?'on':''}" data-a="dMode" data-v="later" role="radio" aria-checked="${d.deliveryMode==='later'}">${tx('نحدده لاحقاً','Decide later')}</button>
      <button class="${d.deliveryMode==='now'?'on':''}" data-a="dMode" data-v="now" role="radio" aria-checked="${d.deliveryMode==='now'}">${tx('أطلب موعداً','Request a time')}</button></div>`;
  if (d.deliveryMode === 'later') {
    h += `<div class="note" style="margin-top:12px">${I('truck',18)}<span>${tx('سنتواصل معك لتأكيد موعد التسليم بعد استلام طلبك وفرز القطع.','We’ll contact you to confirm the delivery time after we collect and sort your order.')}</span></div>`;
  } else if (!d.slot) {
    h += `<div class="note" style="margin-top:12px">${I('info',18)}<span>${tx('اختر موعد الاستلام أولاً.','Choose a pickup time first.')}</span></div>`;
  } else {
    h += `<div class="cal enter-u ${ed?'shake':''}" style="margin-top:12px"><div class="days" role="radiogroup" aria-label="${tx('يوم التسليم','Delivery day')}">${deliveryDays().map(dt => { const k = ymd(dt); return `
        <button class="day ${d.dDate===k?'on':''}" data-a="dDate" data-v="${k}" role="radio" aria-checked="${d.dDate===k}">
          <span class="w">${fmt(dt,{weekday:'short'})}</span><span class="n">${dt.getDate()}</span></button>` }).join('')}</div></div>
      ${d.dDate ? `<div class="slots enter-u" role="radiogroup">${deliverySlots(d.dDate).map(s => `
        <button class="slot ${d.dSlot===s.id?'on':''}" data-a="dSlot" data-v="${s.id}" ${s.left<=0?'disabled':''} role="radio" aria-checked="${d.dSlot===s.id}">
          <span class="tm">${fmtSlot(s.id)}</span><span class="lf">${s.left<=0?tx('غير متاح','Unavailable'):tx('متاح للطلب','Can request')}</span></button>`).join('')}</div>` : ''}
      ${ed ? `<div class="err-msg">${I('alert',16)} ${tx('اختر اليوم والوقت المفضّلين، أو اختر «نحدده لاحقاً»','Choose a preferred day and time, or pick “Decide later”')}</div>` : ''}
      <p class="small muted" style="margin:10px 2px 0">${tx('هذا طلب وليس موعداً مؤكداً. نؤكده أو نقترح بديلاً بعد الاستلام، حسب التوفر ومدة التنظيف.','This is a request, not a confirmed time. We’ll confirm it or suggest another time after pickup, based on availability and cleaning time.')}</p>`;
  }
  return h;
}

        <button data-a="soon"><span class="li-ico">${I('chat',20)}</span><span class="grow" style="text-align:start">${tx('تواصل مع الدعم','Contact support')}</span>${chevF(18)}</button>
        ${o.status===0?`<button data-a="soon"><span class="li-ico">${I('cal',20)}</span><span class="grow" style="text-align:start">${tx('تغيير موعد الاستلام','Reschedule pickup')}</span>${chevF(18)}</button>`:''}
      </div>
    </div></main></div>`;
}

// ---- Sheets ----------------------------------------------------------------------
function sheet(title, body, foot){
  return `<div class="overlay" data-a="closeSheet" data-self="1"><div class="sheet glass strong" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><b>${title}</b><button class="circle" data-a="closeSheet" aria-label="${tx('إغلاق','Close')}">${I('x',20)}</button></div>
    <div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}</div></div>`;
}
function shPickAddr(){
  const cur = addrById(S.currentAddressId);
  return sheet(tx('حدد موقع الاستلام','Choose pickup location'), `
    <div class="loc-card" style="background:#fff"><div class="map">${MAP_ART}<span class="pin">${I('pin',34)}</span></div>
      <div class="addr-line">${I('home',20)}<span class="grow"><b style="display:block">${esc(addrType(cur.type))}</b><span class="small" style="color:var(--ink-2)"><bdi>${esc(addrLine(cur))}</bdi></span></span></div></div>
    <div class="addr-chips" role="radiogroup" style="margin-inline:0;padding-inline:0">
      ${S.addresses.map(x=>`<button class="achip ${S.currentAddressId===x.id?'on':''}" data-a="setCurAddr" data-v="${x.id}" role="radio" aria-checked="${S.currentAddressId===x.id}">
        ${I(x.type==='work'?'box':x.type==='home'?'home':'pin',18)}<b>${esc(addrType(x.type))}</b><span><bdi>${esc(x.district)}</bdi></span></button>`).join('')}
      <button class="achip add" data-a="addAddr">${I('plus',20)}${tx('إضافة عنوان','Add address')}</button>
    </div>`);
}
function shAddr(){
  const f = T.addrForm, er = T.errors;
  const fld = (k, label, ph, opt, extra='') => `<div class="field ${er[k]?'has-err':''}" style="margin-top:14px"><label for="af-${k}">${label}${opt?` <span class="opt">(${tx('اختياري','optional')})</span>`:''}</label>
    <input id="af-${k}" class="inp" data-form="${k}" value="${esc(f[k])}" placeholder="${ph}" ${extra} ${er[k]?'aria-invalid="true"':''}>
    ${er[k]?`<div class="err-msg">${I('alert',16)} ${er[k]}</div>`:''}</div>`;
  return sheet(tx('عنوان جديد','New address'), `
    <span class="flabel">${tx('نوع العنوان','Address type')}</span>
    <div class="chips">${['home','work','other'].map(t=>`<button class="chip ${f.type===t?'on':''}" data-a="afType" data-v="${t}">${addrType(t)}</button>`).join('')}</div>
    ${fld('city', tx('المدينة','City'), tx('مثال: الرياض','e.g. Riyadh'), false, 'autocomplete="address-level2"')}
    ${fld('district', tx('الحي','District'), tx('مثال: حي النرجس','e.g. Al Narjis'), false, 'autocomplete="address-level3"')}
    ${fld('street', tx('الشارع ورقم المبنى','Street & building'), tx('مثال: شارع 15، مبنى 8','e.g. Street 15, Bldg 8'), false, 'autocomplete="address-line1"')}
    ${fld('details', tx('تفاصيل إضافية','More details'), tx('الشقة، الدور، علامة مميزة','Flat, floor, landmark'), true)}
    ${fld('note', tx('تعليمات للسائق','Driver instructions'), tx('مثال: الجرس على اليمين','e.g. Doorbell on the right'), true)}
    <div class="note" style="margin-top:16px;background:#fff">${I('pin',18)}<span>${tx('تحديد الموقع على الخريطة يُضاف مع الربط بالخادم للتحقق من نطاق الخدمة.','Map pin and service-area check will be added with the backend integration.')}</span></div>`,
    `<button class="btn" data-a="saveAddr">${tx('حفظ العنوان','Save address')}</button>`);
}
function shPrefs(){
  const pr = S.prefs, row = (key, label) => `<span class="flabel" style="margin-top:16px">${label}</span><div class="chips">${PREFS[key].map(o=>`<button class="chip ${pr[key]===o.v?'on':''}" data-a="profPref" data-v="${key}:${o.v}">${nm(o)}</button>`).join('')}</div>`;
  return sheet(tx('تفضيلات العناية','Care preferences'), `<p class="sub" style="margin:0">${tx('تُطبَّق تلقائياً على طلباتك الجديدة، ويمكنك تغييرها في كل طلب.','Applied to new orders automatically; you can change them per order.')}</p>
    ${row('shirts', tx('الثياب والقمصان','Thobes & shirts'))}${row('scent', tx('العطر','Fragrance'))}${row('starch', tx('النشا','Starch'))}`,
    `<button class="btn" data-a="closeSheet" data-v="prefsSaved">${tx('تم','Done')}</button>`);
}
function shDemo(){
  const tg = (k, label, desc) => `<button class="row" data-a="demo" data-v="${k}" role="switch" aria-checked="${!!S.demo[k]}" style="width:100%;min-height:58px;padding:6px 0">
    <span class="grow" style="text-align:start"><span style="display:block;font-weight:600;font-size:14.5px">${label}</span><span class="small muted">${desc}</span></span><span class="toggle ${S.demo[k]?'on':''}"></span></button>`;
  const ao = activeOrder();
  return sheet(tx('إعدادات النسخة التجريبية','Prototype settings'), `
    <div class="note warn">${I('info',18)}<span>${tx('كل البيانات وهمية. لا يتم إرسال حجوزات أو مدفوعات حقيقية ولا يوجد اتصال فعلي بـ CleanCloud أو Wafeq أو بوابة الدفع.','All data is mock data. No real bookings or payments are sent, and nothing is connected to CleanCloud, Wafeq or a payment gateway.')}</span></div>
    <h2 class="h2">${tx('المظهر','Appearance')}</h2>
    ${tg('solid', tx('تقليل الشفافية','Reduce transparency'), tx('يعرض البديل المعتم للزجاج (كما في إعداد iOS)','Shows the opaque fallback for glass (like the iOS setting)'))}
    <h2 class="h2">${tx('محاكاة الحالات','Simulate states')}</h2>
    ${tg('failSlots', tx('فشل تحميل المواعيد','Slot loading fails'), tx('لعرض حالة الخطأ في خطوة الموعد','Shows the error state on the time step'))}
    ${tg('failSubmit', tx('فشل إرسال الحجز','Booking submit fails'), tx('لعرض الخطأ مع الحفاظ على البيانات','Shows the error while keeping data'))}
    <button class="btn line sm" data-a="advance" style="margin-top:8px;width:100%" ${ao?'':'disabled'}>${tx('تقديم حالة الطلب الحالي','Advance current order status')}</button>
    <h2 class="h2">${tx('مقاس الجهاز (على الكمبيوتر)','Device size (desktop preview)')}</h2>
    <div class="chips">${FRAMES.map(f=>`<button class="chip ${S.demo.frame===f.id?'on':''}" data-a="frame" data-v="${f.id}">${f.name}</button>`).join('')}</div>
    <button class="btn line sm" data-a="reset" style="margin-top:20px;width:100%;color:var(--err)">${tx('إعادة ضبط كل البيانات التجريبية','Reset all demo data')}</button>`);
}

// ==== RENDER ====================================================================
function screenKey(){ return S.view === 'tab' ? 'tab:' + S.tab : S.view === 'book' ? 'book:' + S.step : S.view }
function render(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = ar() ? 'rtl' : 'ltr';
  document.documentElement.classList.toggle('solid', !!S.demo.solid);
  document.title = tx('ذا كلينر','The Cleaner');
  const key = screenKey(), same = key === T.lastKey;
  const sc = document.querySelector('#app .scroll');
  if (sc && T.lastKey) T.scrollMem[T.lastKey] = sc.scrollTop;
  const app = document.getElementById('app');
  app.innerHTML = S.view === 'tab' ? ({home:vHome, orders:vOrders, packages:vPackages, account:vAccount}[S.tab])()
    : S.view === 'book' ? vBook() : S.view === 'success' ? vSuccess() : vOrder();
  const scr = app.firstElementChild;
  if (!same && T.lastKey) scr.classList.add(S.view === 'tab' && T.lastKey.startsWith('tab:') ? 'enter-u' : T.navDir === 'b' ? 'enter-b' : 'enter-f');
  const nsc = app.querySelector('.scroll');
  if (nsc) nsc.scrollTop = same ? (T.scrollMem[key] || 0) : 0;
  T.lastKey = key;
  updateStatusBar();
  renderSheet();
  save();
}
// Status-bar text turns white while the blue hero is under it.
function updateStatusBar(){
  const sb = document.getElementById('sbar'), hs = document.getElementById('home-scroll');
  sb.classList.toggle('on-hero', !!hs && hs.scrollTop < 180 && !T.sheet);
  document.getElementById('top-scrim')?.classList.toggle('show', !!hs && hs.scrollTop > 220);
  if (hs && !hs.dataset.bound) { hs.dataset.bound = 1; hs.addEventListener('scroll', updateStatusBar, {passive:true}) }
}
function renderSheet(){
  const root = document.getElementById('sheet-root');
  const keepScroll = root.querySelector('.sheet-b')?.scrollTop;
  const map = {pickAddr:shPickAddr, addr:shAddr, prefs:shPrefs, demo:shDemo};
  const wasOpen = !!root.firstChild;
  root.innerHTML = T.sheet ? map[T.sheet]() : '';
  if (T.sheet && wasOpen) { root.querySelector('.overlay').style.animation = 'none'; root.querySelector('.sheet').style.animation = 'none';
    if (keepScroll) root.querySelector('.sheet-b').scrollTop = keepScroll; }
  updateStatusBarSafe();
}
function updateStatusBarSafe(){ const sb = document.getElementById('sbar'); if (T.sheet) sb.classList.remove('on-hero') }
function openSheet(n){ T.sheet = n; document.getElementById('sheet-root').innerHTML = ''; renderSheet() }
function closeSheet(){ T.sheet = null; T.errors = {}; renderSheet(); updateStatusBar() }

// ==== BOOKING LOGIC ==============================================================
function loadSlots(key){
  T.slots = {key, loading:true, error:false, list:[]};
  setTimeout(() => {
    if (T.slots.key !== key) return;
    T.slots.loading = false;
    if (S.demo.failSlots) { T.slots.error = true }
    else {
      const d = parseYmd(key), isFri = d.getDay() === 5, isToday = key === ymd(new Date()), nowH = new Date().getHours();
      const dayIdx = Math.round((d - parseYmd(ymd(new Date()))) / 864e5);
      T.slots.list = SLOT_DEF.map(([a,b], i) => {
        const past = (isToday && a <= nowH + 1) || (isFri && a < 13);
        const left = past || dayIdx === 4 ? 0 : (hash(key + i) % 4);
        return {id:`${a}-${b}`, left, past};
      });
    }
    if (S.view === 'book' && S.step === 2) render();
  }, 650);
}
function validate(step){
  const d = S.draft, e = {};
  if (step === 1) { if (!d.services.length) e.services = 1; if (d.services.includes('home') && !Object.values(d.items).some(q => q > 0)) e.items = 1 }
  if (step === 2) { if (!addrById(d.addressId)) e.address = 1; if (!d.slot) e.slot = 1;
    if (d.slot && d.deliveryMode === 'now' && !(d.dDate && d.dSlot)) e.delivery = 1 }
  T.errors = e;
  return !Object.keys(e).length;
}
function goStep(n, dir){
  T.navDir = dir || (n > S.step ? 'f' : 'b');
  S.step = n; T.errors = {}; T.promoOpen = false;
  if (n === 2) {
    const d = S.draft;
    if (!d.addressId) { d.addressId = S.currentAddressId; const a = addrById(d.addressId); if (a && !d.driverNote) d.driverNote = a.note || '' }
    if (!d.date) d.date = ymd(new Date(Date.now() + 864e5));
    if (T.slots.key !== d.date || T.slots.error) loadSlots(d.date);
  }
  render();
}
function scrollToError(){
  requestAnimationFrame(() => { const el = document.querySelector('#app .has-err, #app .err-msg'); el && el.scrollIntoView({behavior:'smooth', block:'center'}) });
}
function submit(){
  if (T.submitting) return;
  T.submitting = true; T.submitError = false; render();
  setTimeout(() => {
    T.submitting = false;
    if (S.demo.failSubmit) { T.submitError = true; render(); toast(tx('تعذّر إرسال الحجز','Booking couldn’t be sent'), 'err'); document.querySelector('#app .scroll').scrollTop = 0; return }
    const d = S.draft;
    const o = { id:'TC-' + (++S.seq), demo:true, created:Date.now(), status:0, services:[...d.services], bags:d.bags, pieces:d.pieces, items:{...d.items},
      prefs:{...d.prefs}, notes:d.notes, address:{...addrById(d.addressId)}, driverNote:d.driverNote, quickNotes:[...d.quickNotes],
      date:d.date, slot:d.slot, repeat:d.repeat, deliveryMode:d.deliveryMode, dDate:d.dDate, dSlot:d.dSlot };
    S.orders.unshift(o);
    if (d.savePrefs) S.prefs = {...d.prefs};
    S.draft = newDraft(S.prefs); S.orderId = o.id; S.view = 'success'; T.navDir = 'f'; S.fromReview = false;
    render();
  }, 1300);
}

// ==== ACTIONS ======================================================================
const A = {
  tab(v){ S.view = 'tab'; S.tab = v; render() },
  seg(v){ S.ordersSeg = v; render() },
  lang(){ S.lang = ar() ? 'en' : 'ar'; T.lastKey = ''; render(); toast(tx('تم التبديل إلى العربية','Switched to English')) },
  soon(){ toast(tx('تُضاف هذه الميزة في المرحلة التالية','This feature comes in the next phase'), 'info') },
  sheet(v){ openSheet(v) },
  closeSheet(v){ if (v === 'prefsSaved') toast(tx('تم حفظ تفضيلاتك','Preferences saved')); closeSheet() },
  startBook(v, el){
    if (!S.draft.touched) S.draft = newDraft(S.prefs);
    S.draft.touched = true; S.view = 'book'; S.fromReview = false; T.submitError = false;
    if (v && !S.draft.services.includes(v)) { S.draft.services.push(v); S.draft.services.sort((a,b)=>SVC_ORDER.indexOf(a)-SVC_ORDER.indexOf(b)) }
    if (el?.dataset.repeat) S.draft.repeat = el.dataset.repeat;
    S.step = 1; T.navDir = 'f'; T.errors = {}; render();
  },
  resume(){ S.view = 'book'; T.navDir = 'f'; if (S.step === 2) goStep(2); else render() },
  exitBook(){ S.view = 'tab'; S.tab = 'home'; T.navDir = 'b'; T.errors = {}; render(); toast(tx('حفظنا حجزك لتكمله لاحقاً','We saved your booking for later'), 'info') },
  back(){
    if (S.fromReview) { S.fromReview = false; goStep(3, 'b'); return }
    if (S.step === 1) { A.exitBook(); return }
    goStep(S.step - 1, 'b');
  },
  next(){
    if (!validate(S.step)) { render(); scrollToError(); return }
    if (S.fromReview) { S.fromReview = false; for (let s = 1; s <= 2; s++) if (!validate(s)) { goStep(s); scrollToError(); return } goStep(3, 'f'); return }
    goStep(S.step + 1, 'f');
  },
  edit(v){ S.fromReview = true; goStep(+v, 'b') },
  toggleSvc(v){ const s = S.draft.services; const i = s.indexOf(v); i >= 0 ? s.splice(i,1) : s.push(v); s.sort((a,b)=>SVC_ORDER.indexOf(a)-SVC_ORDER.indexOf(b)); delete T.errors.services; if (v==='home') delete T.errors.items; render() },
  bags(v){ S.draft.bags = Math.min(6, Math.max(1, S.draft.bags + +v)); render() },
  pieces(v){ S.draft.pieces = v; render() },
  item(v){ const [id, n] = v.split(':'); const q = Math.min(20, Math.max(0, (S.draft.items[id]||0) + +n)); S.draft.items[id] = q; if (q) delete T.errors.items; render() },
  pref(v){ const [k, val] = v.split(':'); S.draft.prefs[k] = val; render() },
  toggleSavePrefs(){ S.draft.savePrefs = !S.draft.savePrefs; render() },
  pickAddrBk(v){ const d = S.draft; const prev = addrById(d.addressId); if (!d.driverNote || (prev && d.driverNote === prev.note)) d.driverNote = addrById(v).note || ''; d.addressId = v; delete T.errors.address; render() },
  date(v){ if (S.draft.date === v && !T.slots.error) return; S.draft.date = v; S.draft.slot = null; S.draft.dDate = null; S.draft.dSlot = null; loadSlots(v); render() },
  retrySlots(){ loadSlots(S.draft.date); render() },
  slot(v){ S.draft.slot = v; delete T.errors.slot; render() },
  dMode(v){ S.draft.deliveryMode = v; delete T.errors.delivery; render() },
  dDate(v){ S.draft.dDate = v; S.draft.dSlot = null; render() },
  dSlot(v){ S.draft.dSlot = v; delete T.errors.delivery; render() },
  repeat(v){ S.draft.repeat = v; render() },
  qnote(v){ const q = S.draft.quickNotes; const i = q.indexOf(v); i >= 0 ? q.splice(i,1) : q.push(v); render() },
  promo(){ T.promoOpen = true; render(); setTimeout(() => document.getElementById('promo')?.focus(), 50) },
  applyPromo(){ toast(S.draft.promo.trim() ? tx('سيُتحقق من الرمز بعد الربط بالنظام — لم يُطبَّق خصم','The code will be checked once the system is connected — no discount applied') : tx('أدخل الرمز أولاً','Enter a code first'), 'info') },
  submit(){ submit() },
  setCurAddr(v){ S.currentAddressId = v; closeSheet(); render(); toast(tx('تم تغيير موقع الاستلام','Pickup location updated')) },
  addAddr(){ T.addrForm = {type:'home', city:'', district:'', street:'', details:'', note:''}; T.errors = {}; openSheet('addr') },
  afType(v){ T.addrForm.type = v; renderSheet() },
  saveAddr(){
    const f = T.addrForm, e = {}, req = tx('هذا الحقل مطلوب','This field is required');
    ['city','district','street'].forEach(k => { if (!f[k].trim()) e[k] = req });
    if (f.street.trim() && f.street.trim().length < 4) e.street = tx('أدخل اسم الشارع ورقم المبنى','Enter the street and building number');
    T.errors = e;
    if (Object.keys(e).length) { renderSheet(); const el = document.querySelector('.sheet .has-err'); el?.classList.add('shake'); el?.querySelector('input')?.focus(); return }
    const a = {id:'a' + Date.now(), ...Object.fromEntries(Object.entries(f).map(([k,v]) => [k, v.trim()]))};
    S.addresses.push(a);
    if (S.view === 'book') { S.draft.addressId = a.id; S.draft.driverNote = a.note; delete T.errors.address } else S.currentAddressId = a.id;
    T.sheet = null; T.errors = {}; renderSheet(); render(); toast(tx('تمت إضافة العنوان','Address added'));
  },
  profPref(v){ const [k, val] = v.split(':'); S.prefs[k] = val; if (!S.draft.touched) S.draft.prefs = {...S.prefs}; save(); renderSheet() },
  goHome(){ S.view = 'tab'; S.tab = 'home'; T.navDir = 'b'; render() },
  openOrder(v){ S.orderId = v; S.view = 'order'; T.navDir = 'f'; render() },
  closeOrder(){ S.view = 'tab'; T.navDir = 'b'; render() },
  demo(v){ S.demo[v] = !S.demo[v]; save(); document.documentElement.classList.toggle('solid', !!S.demo.solid); renderSheet() },
  advance(){ const o = activeOrder(); if (!o) return; o.status++; render(); renderSheet(); toast(`${o.id}: ${nm(ORDER_STEPS[o.status])}`) },
  frame(v){ S.demo.frame = v; applyFrame(); save(); renderSheet() },
  reset(){ const frame = S.demo.frame, lang = S.lang; S = initialState(); S.demo.frame = frame; S.lang = lang; T.sheet = null; T.slots = {key:null}; T.lastKey = ''; render(); toast(tx('تمت إعادة الضبط','Demo data reset')) }
};

const device = document.getElementById('device');
device.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.dataset.self && ev.target !== el) return;
  A[el.dataset.a]?.(el.dataset.v, el);
});
device.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.bind) { S.draft[t.dataset.bind] = t.value; if (t.dataset.bind === 'notes') { const c = document.getElementById('notes-count'); if (c) c.textContent = `${t.value.length}/300` } save() }
  if (t.dataset.form && T.addrForm) { T.addrForm[t.dataset.form] = t.value; if (T.errors[t.dataset.form] && t.value.trim()) { delete T.errors[t.dataset.form]; t.closest('.field').classList.remove('has-err'); t.closest('.field').querySelector('.err-msg')?.remove() } }
});
// keep focused fields visible above the keyboard and clear of the floating bars
device.addEventListener('focusin', ev => {
  if (ev.target.matches('input,textarea')) setTimeout(() => ev.target.scrollIntoView({block:'center', behavior:'smooth'}), 300);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && T.sheet) closeSheet() });

// ==== VIEWPORT / FRAME ==============================================================
if (location.hash === '#iphone') document.documentElement.classList.add('sim');
const framed = () => matchMedia('(min-width:600px) and (min-height:640px)').matches;
function applyFrame(){
  const f = FRAMES.find(x => x.id === S.demo.frame) || FRAMES[1], st = device.style;
  st.setProperty('--fw', f.w + 'px'); st.setProperty('--fh', f.h + 'px');
  st.setProperty('--fsat', f.sat + 'px'); st.setProperty('--fsab', f.sab + 'px'); st.setProperty('--frad', (f.rad || 6) + 'px');
  st.setProperty('--fscale', Math.min(1, (innerHeight - 48) / f.h, (innerWidth - 48) / f.w));
  document.getElementById('sbar').classList.toggle('no-notch', !f.notch);
  document.getElementById('hbar').classList.toggle('hidden', !f.sab);
}
function fitViewport(){
  const r = document.documentElement.style;
  if (framed()) { r.removeProperty('--app-h'); r.removeProperty('--vv-top'); applyFrame(); return }
  const vv = window.visualViewport;
  r.setProperty('--app-h', (vv ? vv.height : innerHeight) + 'px');
  r.setProperty('--vv-top', (vv ? vv.offsetTop : 0) + 'px');
}
window.visualViewport?.addEventListener('resize', fitViewport);
window.visualViewport?.addEventListener('scroll', fitViewport);
addEventListener('resize', fitViewport);
fitViewport();

if (S.view === 'book' && S.step === 2 && S.draft.date) loadSlots(S.draft.date);
if ((S.view === 'success' || S.view === 'order') && !S.orders.find(o => o.id === S.orderId)) S.view = 'tab';
render();
</script>
