<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231458F0%27/%3E%3Cpath d=%27M16 7s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3C/svg%3E">
<title>ذا كلينر — The Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: white app canvas, one blue hero on Home, glass only on floating chrome
   (capsule nav, action bars, headers, sheets, hero pills). Forms, cards and bills stay solid. */
:root{
  --blue:#1458F0;--blue-d:#0B42C4;--blue-50:#EEF3FF;--blue-100:#DDE7FF;--blue-200:#BFD3FF;
  --ink:#0B1630;--ink-2:#36435E;--muted:#5D6B86;--line:#E3E9F3;--surface:#F4F7FC;--bg:#FFFFFF;
  --ok:#0E8A44;--ok-50:#E6F6ED;--warn:#8A5700;--warn-50:#FFF4DE;--err:#C42F39;--err-50:#FDECEE;
  --demo-line:#E0B45C;--demo-bg:#FFFBF2;
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.86);--glass-line:rgba(255,255,255,.8);
  --glass-edge:rgba(11,22,48,.09);--glass-shadow:0 12px 32px rgba(16,38,92,.14),0 1px 3px rgba(16,38,92,.08);
  --glass-tint:rgba(20,88,240,.12);--blur:blur(22px) saturate(180%);
  --scrim:rgba(11,22,48,.28);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.25,.5,1);--dx:1;
}
[dir=rtl]{--dx:-1}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
}
@media (prefers-reduced-transparency:reduce){
  :root{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
  .glass,.overlay{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
html.solid{--glass:#FFFFFF;--glass-strong:#FFFFFF;--glass-line:#E3E9F3;--scrim:rgba(11,22,48,.45)}
html.solid .glass,html.solid .overlay{-webkit-backdrop-filter:none;backdrop-filter:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
svg{flex-shrink:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 .5px var(--glass-edge)}
.glass.strong{background:var(--glass-strong)}

#device{position:fixed;inset:0;top:var(--vv-top,0px);height:var(--app-h,100%);background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.sbar,.hbar{display:none}
.sbar{position:absolute;top:0;inset-inline:0;height:var(--sat);align-items:center;justify-content:space-between;padding:0 30px;font:600 15px/1 system-ui;z-index:60;pointer-events:none;direction:ltr;color:var(--ink);transition:color .3s}
.sbar.on-hero{color:#fff}
.sbar .island{width:120px;height:34px;border-radius:20px;background:#0B1630}
.sbar.no-notch .island{display:none}
.hbar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0B1630;z-index:60;pointer-events:none}
.hbar.hidden{display:none!important}
.top-scrim{position:absolute;top:0;inset-inline:0;height:calc(var(--sat) + 6px);z-index:20;border:0;border-radius:0;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 1px 0 var(--glass-edge)}
.top-scrim.show{opacity:1}
html.sim #device{--sat:54px;--sab:34px}
html.sim.se #device{--sat:20px;--sab:0px}
html.sim .sbar{display:flex}html.sim .hbar{display:block}
html.sim.se .sbar .island,html.sim.se .hbar{display:none}
@media (min-width:600px) and (min-height:640px){
  body{background:#E6ECF6;display:flex;align-items:center;justify-content:center}
  #device{position:relative;inset:auto;top:auto;width:var(--fw,393px);height:var(--fh,852px);flex-shrink:0;border-radius:var(--frad,52px);
    box-shadow:0 0 0 11px #0B1630,0 40px 90px rgba(11,22,48,.35);--sat:var(--fsat,54px);--sab:var(--fsab,34px);transform:scale(var(--fscale,1))}
  .sbar{display:flex}.hbar{display:block}
}

/* ---------- layout ---------- */
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.enter-f{animation:enterF .3s var(--ease)}
.enter-b{animation:enterB .3s var(--ease)}
.enter-u{animation:fadeUp .3s ease-out}
.enter-up{animation:enterUp .42s var(--ease)}
@keyframes enterF{from{opacity:0;transform:translateX(calc(24px * var(--dx)))}}
@keyframes enterB{from{opacity:0;transform:translateX(calc(-24px * var(--dx)))}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes enterUp{from{opacity:.4;transform:translateY(70%)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.sheet-b::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.with-tabbar{padding-bottom:calc(var(--sab) + 104px)}
.with-fbar{padding-bottom:calc(var(--sab) + 112px)}
.with-head{padding-top:calc(var(--sat) + 112px)}
.with-subhead{padding-top:calc(var(--sat) + 74px)}
.end-space{padding-bottom:calc(var(--sab) + 28px)}
.top-title{padding:calc(var(--sat) + 14px) 16px 4px}

/* ---------- type ---------- */
.h1{font-size:26px;font-weight:700;margin:6px 0 4px;line-height:1.3;letter-spacing:-.2px;text-wrap:balance}
.h2{font-size:17px;font-weight:700;margin:26px 0 12px;line-height:1.4;display:flex;align-items:center;gap:6px}
.h2 .opt{font-weight:400;font-size:13.5px;color:var(--muted)}
.sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.55}
[dir=ltr] .h1{letter-spacing:-.5px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;padding:0 20px;
  box-shadow:0 6px 16px rgba(20,88,240,.28),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .15s var(--ease),background .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97);background:var(--blue-d)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.btn.sec{background:var(--blue-50);color:var(--blue);box-shadow:none}
.btn.line{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{min-height:44px;width:auto;font-size:14.5px;border-radius:14px;padding:0 16px}
.btn.demo{background:#fff;color:var(--warn);border:1.5px solid var(--demo-line);box-shadow:none;min-height:46px;font-size:14.5px}
.btn.wa{background:#128C4B;box-shadow:0 6px 16px rgba(18,140,75,.25)}
.btn.wa:active{background:#0D6E3A}
.link{color:var(--blue);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .15s var(--ease)}
.circle:active{transform:scale(.92)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.spin.dark{border-color:rgba(20,88,240,.25);border-top-color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- generic ---------- */
.card{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(16,38,92,.04)}
.card.tint{background:var(--surface);border-color:transparent;box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ico{width:46px;height:46px;border-radius:15px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-50);color:var(--blue)}
.tag.warn{background:var(--warn-50);color:var(--warn)}
.tag.ok{background:var(--ok-50);color:var(--ok)}
.tag.err{background:var(--err-50);color:var(--err)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);color:var(--ink-2);font-size:13.5px;line-height:1.6}
.note svg{margin-top:2px;color:var(--blue)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-50);color:#5E3D00}.note.warn svg{color:var(--warn)}
.note.err{background:var(--err-50);color:#7A1C22}.note.err svg{color:var(--err)}
.note.ok{background:var(--ok-50);color:#0B4F29}.note.ok svg{color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv>span:last-child{text-align:end;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.demo-box{border:1.5px dashed var(--demo-line);background:var(--demo-bg);border-radius:20px;padding:14px;margin-top:22px}
.demo-box h3{font-size:13px;color:var(--warn);margin:0 0 4px;display:flex;gap:6px;align-items:center}
.demo-box p{margin:0 0 10px;font-size:12.5px;color:#6B4A00;line-height:1.55}

/* ---------- 3D service art ---------- */
.art3d{display:block;width:100%;height:100%}
.art{position:relative;border-radius:18px;background:linear-gradient(150deg,#F3F7FF,#E1EAFE);display:grid;place-items:center;overflow:hidden}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -10px 24px rgba(20,88,240,.06)}

/* ---------- auth ---------- */
.auth{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.auth .scroll{padding:calc(var(--sat) + 12px) 20px 24px}
.auth-top{display:flex;align-items:center;gap:8px;min-height:48px}
.auth-hero{position:relative;height:230px;margin:6px -4px 8px}
.auth-hero .a{position:absolute;width:118px;height:118px;filter:drop-shadow(0 14px 22px rgba(20,88,240,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.brandmark{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(150deg,#2E6BFF,#0B42C4);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(20,88,240,.3)}
.auth-foot{padding:12px 20px calc(var(--sab) + 16px)}
.phone-field{display:flex;align-items:stretch;gap:8px;direction:ltr}
.phone-field .cc{display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:16px;background:var(--surface);font-weight:600;min-height:56px}
.phone-field input{flex:1;min-width:0;text-align:left;font-size:19px;letter-spacing:.5px}
.otp{direction:ltr;text-align:center;font-size:30px;letter-spacing:14px;font-weight:700;padding-inline-start:28px}
.demo-code{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--demo-line);background:var(--demo-bg);color:#5E3D00;font-size:13.5px;line-height:1.55}
.demo-code b{font-size:20px;letter-spacing:4px;color:var(--ink);direction:ltr;unicode-bidi:isolate}

/* ---------- Home ---------- */
.hero{position:relative;color:#fff;background:linear-gradient(160deg,#0D44D6 0%,#1458F0 55%,#3B7BFF 100%);padding:calc(var(--sat) + 10px) 16px 50px;overflow:hidden;isolation:isolate}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
[dir=ltr] .hero-art{transform:scaleX(-1)}
.hero-top{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;color:var(--ink);font-weight:600;font-size:14px;min-width:0;transition:transform .15s var(--ease)}
[dir=rtl] .pill{padding:0 6px 0 14px}
.pill:active{transform:scale(.97)}
.pill .dot{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.pill .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-copy{margin-top:24px;max-width:min(320px,70%)}
.hero-copy h1{font-size:27px;line-height:1.35;margin:10px 0 6px;font-weight:700;text-wrap:balance}
[dir=ltr] .hero-copy h1{font-size:25px}
.hero-copy p{margin:0 0 18px;font-size:15.5px;opacity:.95;line-height:1.6}
.hero .demo{font-size:12px;font-weight:600;color:var(--warn);padding:5px 12px;min-height:30px;border-radius:999px;display:inline-flex;align-items:center}
.hero-cta{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;color:var(--blue);font-weight:700;font-size:15.5px;transition:transform .15s var(--ease)}
.hero-cta:active{transform:scale(.97)}
.hero-3d{position:absolute;inset-inline-end:-6px;bottom:30px;width:150px;height:150px;opacity:.98;filter:drop-shadow(0 18px 24px rgba(4,20,70,.35));pointer-events:none}
.main-sheet{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 16px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{font-size:18px;font-weight:700;margin:0}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc-card{display:flex;flex-direction:column;width:100%;padding:10px;border-radius:24px;border:1px solid var(--line);background:var(--bg);box-shadow:0 2px 10px rgba(16,38,92,.05);transition:transform .15s var(--ease);text-align:start}
.svc-card:active{transform:scale(.98)}
.svc-card .art{height:96px}
.svc-card .art svg{width:86px;height:86px}
.svc-t{font-weight:700;font-size:15px;line-height:1.35}
.svc-d{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
.svc-card .body{padding:10px 4px 2px;display:flex;flex-direction:column;gap:4px;flex:1}
.go{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0;margin-top:auto;align-self:flex-end}
.promo2{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:linear-gradient(120deg,#EAF1FF,#F6F9FF);border:1px solid var(--blue-100);width:100%}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:var(--surface);border-radius:18px;padding:12px 10px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.how b{display:block;color:var(--blue);font-size:13px;margin-bottom:2px}
.active-order{display:block;width:100%;text-align:start;border-radius:24px;padding:16px;background:var(--ink);color:#fff;margin-bottom:14px}
.active-order .muted{color:#A9B6CE}
.ao-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ao-btn{flex:1;min-height:46px;border-radius:14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;white-space:nowrap}
.ao-btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.ao-btn.pay{background:#fff;color:var(--blue)}
.mini-prog{display:flex;gap:4px;margin-top:14px}
.mini-prog i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.mini-prog i.on{background:#7FA6FF}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--blue-50);width:100%;min-height:58px;margin-bottom:12px}

/* ---------- floating capsule navigation + separate create button ---------- */
.navwrap{position:absolute;inset-inline:16px;bottom:calc(var(--sab) + 12px);display:flex;align-items:center;justify-content:center;gap:10px;z-index:30;animation:barIn .4s var(--ease)}
@keyframes barIn{from{transform:translateY(20px);opacity:0}}
.capsule{position:relative;flex:1 1 auto;max-width:292px;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:999px;min-height:64px}
.ind{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc((100% - 10px) / 3);border-radius:999px;background:#fff;
  box-shadow:0 2px 10px rgba(16,38,92,.14),inset 0 0 0 .5px rgba(11,22,48,.06);transform:translateX(calc(var(--i,0) * 100% * var(--dx)));transition:transform .42s var(--spring)}
html.solid .ind{background:var(--blue-50);box-shadow:none}
.nb{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:999px;color:var(--muted);font-size:11px;font-weight:600;min-height:54px;transition:color .25s}
.nb svg{transition:transform .2s var(--ease)}
.nb:active svg{transform:scale(.86)}
.nb.on{color:var(--blue)}
.plus{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:linear-gradient(150deg,#3274FF,#1458F0 55%,#0B42C4);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(20,88,240,.38),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s var(--spring)}
.plus svg{transition:transform .3s var(--spring)}
.plus:active{transform:scale(.9)}
.plus:active svg{transform:rotate(90deg)}

/* ---------- headers / bars ---------- */
.bk-head{position:absolute;top:0;inset-inline:0;z-index:25;padding:calc(var(--sat) + 8px) 12px 10px;border-radius:0 0 22px 22px;border-top:0;display:flex;align-items:center;gap:10px}
.bk-head .ttl{flex:1;text-align:center;min-width:0}
.bk-head .ttl b{display:block;font-size:16.5px}
.bk-head .ttl span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-head .circle{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--glass-edge)}
.bk-head .spacer{width:44px;flex-shrink:0}
.prog{display:flex;gap:5px;justify-content:center;margin-top:5px}
.prog i{width:18px;height:4px;border-radius:2px;background:var(--line);transition:all .3s}
.prog i.on{background:var(--blue);width:28px}
.fbar{position:absolute;inset-inline:12px;bottom:calc(var(--sab) + 10px);z-index:30;border-radius:30px;padding:8px;display:flex;align-items:center;gap:10px;animation:barIn .35s var(--ease)}
.fbar .est{flex:1;min-width:0;padding-inline-start:12px}
.fbar .est .l{font-size:12px;color:var(--muted);white-space:nowrap}
.fbar .est .v{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.fbar .btn{width:auto;min-width:132px;border-radius:24px;min-height:52px}
.fbar.full .btn{flex:1}

/* ---------- booking ---------- */
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);transition:border-color .2s,background .2s;text-align:start}
.choice.on{border-color:var(--blue);background:var(--blue-50)}
.choice .art{width:60px;height:60px;flex-shrink:0;border-radius:16px}
.choice .art svg{width:54px;height:54px}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;transition:all .2s;background:var(--bg);flex-shrink:0}
.on>.check,.on .check{background:var(--blue);border-color:var(--blue)}

function computeBill(entries, taxMode){
  const lines = [], assess = [];
  for (const e of entries) {
    const it = ITEM[e.id]; if (!it || !(e.qty > 0)) continue;
    if (it.assess) assess.push({ id:it.id, qty:e.qty });
    else lines.push({ id:it.id, cat:it.cat, qty:e.qty, unit:it.price, total:it.price * e.qty });
  }
  const subtotal = lines.reduce((s, l) => s + l.total, 0);
  const delivery = PRICING.deliveryFee == null ? 0 : PRICING.deliveryFee;
  const discount = 0, base = subtotal + delivery - discount;
  let vat = null, total = base;
  if (taxMode === 'inclusive') vat = Math.round(base * PRICING.vatRate * 100 / (100 + PRICING.vatRate * 100));
  if (taxMode === 'exclusive') { vat = Math.round(base * PRICING.vatRate); total = base + vat }
  return { lines, assess, subtotal, delivery, deliverySet: PRICING.deliveryFee != null, discount, taxMode, vat, total, issued: Date.now() };
}

function walletBal(){
  let funded = 0, comp = 0;
  for (const t of S.wallet.tx) if (t.status === 'posted') { if (t.bucket === 'comp') comp += t.amount; else funded += t.amount }
  return { funded, comp, total: funded + comp };
}
function postTx(t){
  if (t.ref && S.wallet.tx.some(x => x.ref === t.ref && x.bucket === t.bucket && x.status === 'posted')) return false;   // idempotent
  S.wallet.tx.push({ id:'wt_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), at:Date.now(), status:'posted', ...t });
  return true;
}
// Wallet spend order (prototype assumption, pending approval): compensation credit first, then customer-funded balance.
function walletDebit(amount, ref, orderId){
  const b = walletBal(); if (amount > b.total) return false;
  const fromComp = Math.min(b.comp, amount), fromFunded = amount - fromComp;
  if (fromComp) postTx({ kind:'payment', bucket:'comp', amount:-fromComp, ref, orderId });
  if (fromFunded) postTx({ kind:'payment', bucket:'funded', amount:-fromFunded, ref, orderId });
  return true;

// ---- Toast -------------------------------------------------------------------
function toast(msg, kind='ok'){
  const root = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 't-msg ' + kind;
  el.innerHTML = (kind === 'ok' ? I('check',18) : kind === 'err' ? I('alert',18) : I('info',18)) + `<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260) }, 2800);
}

        <div id="pl-list">${priceListHtml()}</div>

function priceListHtml(){
  const q = normAr(T.plQuery);
  const match = it => !q || normAr(it.ar).includes(q) || it.en.toLowerCase().includes(q.toLowerCase()) || normAr(nm(CAT[it.cat])).includes(q);
  const cats = CATS.filter(c => T.plCat === 'all' || T.plCat === c.id);
  let total = 0;
  const html = cats.map(c => {
    const rows = CATALOGUE.filter(it => it.cat === c.id && match(it)); total += rows.length;
    if (!rows.length) return '';
    return `<section class="pl-cat"><h3><span>${nm(c)}</span><span class="tag">${rows.length}</span></h3>
      ${rows.map(it => `<div class="pl-row"><span class="nm grow"><b>${esc(itemName(it))}</b><span>${esc(itemAlt(it))}</span></span>
        <span class="pr ${it.assess?'assess':''}">${it.assess ? tx('السعر عند التقييم','Price on assessment') : money(it.price)}</span></div>`).join('')}</section>`;
  }).join('');
  return total ? html : `<div class="empty"><div class="ico">${I('search',30)}</div><b>${tx('ما لقينا نتائج','No results')}</b><p class="sub">${tx('جرّب اسماً آخر أو اختر «الكل».','Try another name or choose “All”.')}</p></div>`;
}

function deliveryDays(){

}

// Order help: reasons by stage → optional details → prepared WhatsApp/email composer. Nothing is sent automatically.
function helpMessage(o, r, details){
  const lines = ar()
    ? ['السلام عليكم، أحتاج مساعدة بخصوص طلبي في ذا كلينر.', `رقم الطلب: ${o.id}`, `السبب: ${r.ar}`]
    : ['Hello, I need help with my The Cleaner order.', `Order: ${o.id}`, `Reason: ${r.en}`];
  if (details.trim()) lines.push((ar() ? 'التفاصيل: ' : 'Details: ') + details.trim());
  return lines.join('\n');
}
const helpSubject = (o, r) => ar() ? `طلب مساعدة · ${o.id} · ${r.ar}` : `Help request · ${o.id} · ${r.en}`;
function helpLinks(){
  const H = T.help, o = orderById(H.orderId), r = HELP_REASONS.find(x => x.v === H.reason), ch = supportChannels();
  if (!r) return { wa:null, mail:null, msg:'' };
  const msg = helpMessage(o, r, H.details);
  return { msg,
    wa: ch.wa ? `https://wa.me/${ch.wa}?text=${encodeURIComponent(msg)}` : null,
    mail: ch.email ? `mailto:${ch.email}?subject=${encodeURIComponent(helpSubject(o, r))}&body=${encodeURIComponent(msg.replace(/\n/g, '\r\n'))}` : null };
}
function shHelp(){
  const H = T.help, o = orderById(H.orderId), ch = supportChannels();
  const reasons = HELP_REASONS.filter(r => r.when(o));

}

  const scr = app.firstElementChild;

// ==== BOOKING LOGIC ==============================================================
function loadSlots(key){
  T.slots = {key, loading:true, error:false, list:[]};
  setTimeout(() => {
    if (T.slots.key !== key) return;
    T.slots.loading = false;
    if (S.demo.failSlots) { T.slots.error = true }
    else {
      const d = parseYmd(key), isFri = d.getDay() === 5, isToday = key === ymd(new Date()), nowH = new Date().getHours();
      const dayIdx = Math.round((d - parseYmd(ymd(new Date()))) / 864e5);
      T.slots.list = SLOT_DEF.map(([a,b], i) => {
        const past = (isToday && a <= nowH + 1) || (isFri && a < 13);
        const left = past || dayIdx === 4 ? 0 : (hash(key + i) % 4);
        return {id:`${a}-${b}`, left, past};
      });
    }
    if (S.view === 'book' && S.step === 2) render();
  }, 650);
}
function validate(step){
  const d = S.draft, e = {};
  if (step === 1 && !d.services.length) e.services = 1;
  if (step === 2) { if (!addrById(d.addressId)) e.address = 1; if (!d.slot) e.slot = 1;
    if (d.slot && d.deliveryMode === 'now' && !(d.dDate && d.dSlot)) e.delivery = 1 }
  T.errors = e;
  return !Object.keys(e).length;
}
function goStep(n, dir){
  T.navDir = dir || (n > S.step ? 'f' : 'b');
  S.step = n; T.errors = {};
  if (n === 2) {
    const d = S.draft;
    if (!d.addressId && S.currentAddressId) d.addressId = S.currentAddressId;
    if (!d.date) d.date = ymd(new Date(Date.now() + 864e5));
    if (T.slots.key !== d.date || T.slots.error) loadSlots(d.date);
  }
  render();
}
function scrollToError(){
  requestAnimationFrame(() => { const el = document.querySelector('#app .has-err, #app .err-msg'); el && el.scrollIntoView({behavior:'smooth', block:'center'}) });
}
function submit(){
  if (T.submitting) return;
  T.submitting = true; T.submitError = false; render();
  setTimeout(() => {
    T.submitting = false;
    if (S.demo.failSubmit) { T.submitError = true; render(); toast(tx('تعذّر إرسال الحجز','Booking couldn’t be sent'), 'err'); document.querySelector('#app .scroll').scrollTop = 0; return }
    const d = S.draft;
    const o = { id:'TC-' + (++S.seq), demo:true, created:Date.now(), status:0, payment:'none', bill:null, payments:[],
      services:[...d.services], prefs:{...d.prefs}, notes:d.notes, address:{...addrById(d.addressId)}, bagSpot:d.bagSpot, quickNotes:[...d.quickNotes],
      date:d.date, slot:d.slot, repeat:d.repeat, deliveryMode:d.deliveryMode, dDate:d.dDate, dSlot:d.dSlot };
    S.orders.unshift(o);
    if (d.savePrefs) S.prefs = {...d.prefs};
    S.draft = newDraft(S.prefs); S.orderId = o.id; S.view = 'success'; T.navDir = 'f'; S.fromReview = false;
    render();
  }, 1300);
}

// ==== ORDER / PAYMENT / WALLET LOGIC ===============================================
function canAdvance(o){
  if (o.status >= DELIVERED) return { ok:false };
  if (!o.bill && o.payment !== 'legacy') return { ok:false, reason:'nobill' };
  if (o.status + 1 >= OUT_FOR_DELIVERY && o.payment !== 'paid' && o.payment !== 'legacy') return { ok:false, reason:'unpaid' };
  return { ok:true };
}
function advanceOrder(o){
  const c = canAdvance(o);
  if (!c.ok) {
    if (c.reason === 'unpaid') toast(tx('لا يمكن خروج الطلب للتوصيل قبل الدفع','The order can’t go out for delivery before it’s paid'), 'err');
    else if (c.reason === 'nobill') toast(tx('سجّل القطع أولاً (محاكاة السائق)','Record the items first (driver simulation)'), 'info');
    return false;
  }
  o.status++; save(); render(); toast(`${o.id}: ${statusText(o)}`); return true;
}
function startPay(orderId){
  const o = orderById(orderId);
  if (!o || !o.bill) return;
  if (o.payment === 'paid') { toast(tx('هذا الطلب مدفوع مسبقاً','This order is already paid'), 'info'); return }
  if (T.pay && T.pay.state === 'processing') return;
  T.pay = { orderId, method:'apple', outcome:'success', state:'idle', useWallet: walletBal().total > 0 }; openSheet('pay');
}
function confirmPay(){
  const P_ = T.pay; if (!P_ || P_.state === 'processing') return;           // duplicate-tap guard
  const o = orderById(P_.orderId);
  if (!o || o.payment === 'paid') { closeSheet(); toast(tx('هذا الطلب مدفوع مسبقاً','This order is already paid'), 'info'); return }
  const plan = payPlan(P_, o);
  P_.state = 'processing'; P_.attemptId = 'pay_' + Date.now().toString(36); renderSheet();
  setTimeout(() => {
    if (T.pay !== P_) return;
    // Wallet funds are only debited after the external part succeeds — a failed split never deducts the wallet.
    let ok = plan.ext === 0 ? true : P_.outcome === 'success';
    if (ok && plan.walletPart) ok = walletDebit(plan.walletPart, P_.attemptId, o.id);
    o.payments = o.payments || [];
    o.payments.push({ id:P_.attemptId, method: plan.ext === 0 ? 'wallet' : P_.method, walletAmount:plan.walletPart, externalAmount:plan.ext,
      amount:o.bill.total, status: ok ? 'succeeded' : 'failed', at:Date.now() });
    if (ok) { o.payment = 'paid'; P_.state = 'success'; P_.done = plan } else P_.state = 'failed';
    save(); renderSheet(); render();
    if (!ok) toast(tx('ما تمت عملية الدفع (محاكاة)','Payment didn’t go through (simulated)'), 'err');
  }, 1400);
}
function confirmTopup(){
  const P_ = T.topup; if (!P_ || P_.state === 'processing') return;
  const amount = P_.custom !== '' ? Math.round(parseFloat(P_.custom.replace(/[^\d.]/g,'')) * 100) : P_.amount;
  if (!(amount >= WALLET_CFG.min && amount <= WALLET_CFG.max)) { T.errors.topup = 1; renderSheet(); return }
  delete T.errors.topup;
  P_.state = 'processing'; P_.ref = 'top_' + Date.now().toString(36); renderSheet();
  setTimeout(() => {
    if (T.topup !== P_) return;
    if (P_.outcome === 'success') { postTx({ kind:'topup', bucket:'funded', amount, method:P_.method, ref:P_.ref }); P_.state = 'success'; P_.done = amount }
    else { S.wallet.tx.push({ id:'wt_' + Date.now().toString(36), kind:'topup', bucket:'funded', amount, method:P_.method, ref:P_.ref, status:'failed', at:Date.now() }); P_.state = 'failed' }
    save(); renderSheet(); if (S.view === 'wallet') render();
  }, 1200);
}

    S.wallet.offers.push({ id:'co_' + Date.now().toString(36), orderId:C.orderId, amount:C.amount, reason:C.reason, status:'pending', at:Date.now() });
    closeSheet(); save(); render(); toast(tx('وصل عرض تعويض تجريبي للعميل','A demo compensation offer was sent to the customer')) },
  offerAccept(v){ const o = S.wallet.offers.find(x => x.id === v); if (!o || o.status !== 'pending') return;
    o.status = 'accepted'; o.decidedAt = Date.now();
    postTx({ kind:'compensation', bucket:'comp', amount:o.amount, orderId:o.orderId, ref:o.id });
    save(); render(); toast(tx(`أُضيف ${moneyTxt(o.amount)} لمحفظتك`,`${moneyTxt(o.amount)} added to your wallet`)) },
  offerDecline(v){ const o = S.wallet.offers.find(x => x.id === v); if (!o || o.status !== 'pending') return; o.status = 'declined'; o.decidedAt = Date.now(); save(); render() },
  // order help
  helpOpen(v){ T.help = { orderId:v, reason:null, details:'', opened:null }; openSheet('help') },
  helpReason(v){ T.help.reason = v; T.help.opened = null; renderSheet() },
  helpOpened(v){ T.help.opened = v; setTimeout(renderSheet, 300) },   // composer opened — the customer still has to send it
  helpCopy(){ const L = helpLinks(); navigator.clipboard?.writeText(L.msg).then(() => toast(tx('نُسخت الرسالة','Message copied')), () => toast(tx('ما قدرنا ننسخ الرسالة','Couldn’t copy the message'), 'err')) },
  supSave(){ const wa = document.getElementById('sup-wa').value.replace(/\D/g,''), em = document.getElementById('sup-mail').value.trim();
    if (wa && !/^\d{8,15}$/.test(wa)) { toast(tx('رقم واتساب غير صحيح — أدخله مع رمز الدولة','Invalid WhatsApp number — include the country code'), 'err'); return }
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { toast(tx('البريد الإلكتروني غير صحيح','Invalid email address'), 'err'); return }
    G.supportTest = { whatsapp:wa, email:em }; save(); renderSheet(); render(); toast(tx('حُفظت قنوات التجربة على هذا الجهاز','Test channels saved on this device')) },
  supClear(){ G.supportTest = { whatsapp:'', email:'' }; save(); renderSheet(); render() },
  // demo driver & progress
  driverOpen(v){ const o = orderById(v); T.driver = { orderId:v, lines: sampleEntries(o.services) }; T.errors = {}; openSheet('driver') },
  drvQty(v){ const [id, n] = v.split(':'); const l = T.driver.lines.find(x => x.id === id); if (!l) return; l.qty += +n; if (l.qty <= 0) T.driver.lines = T.driver.lines.filter(x => x !== l); renderSheet() },
  drvAdd(){ const id = document.getElementById('drv-add').value; const l = T.driver.lines.find(x => x.id === id); l ? l.qty++ : T.driver.lines.push({ id, qty:1 }); delete T.errors.driver; renderSheet() },
  drvConfirm(){
    const D = T.driver, o = orderById(D.orderId), bill = computeBill(D.lines, S.demo.tax);
    if (!bill.lines.length) { T.errors.driver = 1; renderSheet(); return }
    o.bill = bill; o.payment = 'unpaid'; if (o.status < 1) o.status = 1;
    T.sheet = null; T.driver = null; renderSheet(); save(); T.lastKey = ''; render();
    toast(tx('تم تسجيل القطع وإرسال المبلغ (محاكاة)','Items recorded and bill sent (simulated)'));
  },
  advance(v){ const o = v ? orderById(v) : activeOrder(); if (o) advanceOrder(o) },
  rate(v){ T.rate = { orderId:v, n:0 }; openSheet('rate') },
  rateSet(v){ T.rate.n = +v; renderSheet() },
  rateSubmit(){ const o = orderById(T.rate.orderId); o.rating = T.rate.n; closeSheet(); render(); toast(tx('شكراً لتقييمك','Thanks for your rating')) },
  taxMode(v){ S.demo.tax = v; save(); renderSheet() },
  demo(v){ if (v === 'solid') G.solid = !G.solid; else S.demo[v] = !S.demo[v]; save(); document.documentElement.classList.toggle('solid', !!G.solid); renderSheet() },
  frame(v){ G.frame = v; applyFrame(); save(); renderSheet() },
  resetAll(){ Object.keys(localStorage).filter(k => k.startsWith('thecleaner-proto-v5')).forEach(k => localStorage.removeItem(k));
    const lang = G.lang, frame = G.frame; G = { lang, phone:null, frame, solid:false, v3Adopted:true, supportTest:{whatsapp:'', email:''} }; S = null;
    T.sheet = null; T.auth = { step:'welcome', phone:'', code:null, entered:'', err:null, resendAt:0, busy:false, name:'' }; T.lastKey = ''; render(); toast(tx('حُذفت الحسابات التجريبية','Demo accounts deleted')) }
};
function tickResend(){ clearTimeout(T.resendTimer); if (T.auth.step !== 'otp') return;
  const el = document.getElementById('resend-wait');
  if (Date.now() >= T.auth.resendAt) { if (el) render(); return }
  if (el) el.querySelector('.num').textContent = `0:${String(Math.ceil((T.auth.resendAt - Date.now())/1000)).padStart(2,'0')}`;
  T.resendTimer = setTimeout(tickResend, 1000) }

const device = document.getElementById('device');
device.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled || !el.dataset.a) return;
  if (el.dataset.self && ev.target !== el) return;
  A[el.dataset.a]?.(el.dataset.v, el);
});
device.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.bind) { S.draft[t.dataset.bind] = t.value; if (t.dataset.bind === 'notes') { const c = document.getElementById('notes-count'); if (c) c.textContent = `${t.value.length}/300` } save() }
  if (t.dataset.auth) { const A_ = T.auth; if (t.dataset.auth === 'phone') A_.phone = t.value; if (t.dataset.auth === 'otp') { A_.entered = t.value.replace(/\D/g,'').slice(0,4); if (t.value !== A_.entered) t.value = A_.entered } if (t.dataset.auth === 'name') A_.name = t.value;
    if (A_.err) { A_.err = null; t.closest('.field')?.classList.remove('has-err'); t.closest('.field')?.querySelector('.err-msg')?.remove() } }
  if (t.dataset.plq) { T.plQuery = t.value; document.getElementById('pl-list').innerHTML = priceListHtml() }
  if (t.dataset.help && T.help) { T.help.details = t.value; const L = helpLinks(); const pv = document.getElementById('help-preview'); if (pv) pv.textContent = L.msg;
    const wa = document.getElementById('help-wa'), ml = document.getElementById('help-mail'); if (wa && L.wa) wa.href = L.wa; if (ml && L.mail) ml.href = L.mail }
  if (t.dataset.topup && T.topup) { T.topup.custom = t.value; const b = document.getElementById('topup-confirm'); const a = Math.round(parseFloat(t.value.replace(/[^\d.]/g,'')) * 100);
    if (b) b.textContent = tx('اشحن','Top up') + (a > 0 ? ' · ' + moneyTxt(a) : '');
    document.querySelectorAll('[data-a=topupAmt]').forEach(c => c.classList.toggle('on', t.value === '' && +c.dataset.v === T.topup.amount)) }
  if (t.dataset.form && T.addrForm) { T.addrForm[t.dataset.form] = t.value; if (T.errors[t.dataset.form] && t.value.trim()) { delete T.errors[t.dataset.form]; t.closest('.field').classList.remove('has-err'); t.closest('.field').querySelector('.err-msg')?.remove() } }
});
device.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !ev.target.dataset?.auth) return;
  ev.preventDefault(); ({ phone:A.authPhone, otp:A.authVerify, name:A.authName })[ev.target.dataset.auth]?.();
});
device.addEventListener('focusin', ev => {
  if (ev.target.matches('textarea,input:not([type=search])')) setTimeout(() => ev.target.scrollIntoView({block:'center', behavior:'smooth'}), 300);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && T.sheet) closeSheet() });

// ==== VIEWPORT / FRAME ==============================================================
if (location.hash === '#iphone') document.documentElement.classList.add('sim');
if (location.hash === '#iphone-se') document.documentElement.classList.add('sim','se');
const framed = () => matchMedia('(min-width:600px) and (min-height:640px)').matches;
function applyFrame(){
  const f = FRAMES.find(x => x.id === G.frame) || FRAMES[1], st = device.style;
  st.setProperty('--fw', f.w + 'px'); st.setProperty('--fh', f.h + 'px');
  st.setProperty('--fsat', f.sat + 'px'); st.setProperty('--fsab', f.sab + 'px'); st.setProperty('--frad', (f.rad || 6) + 'px');
  st.setProperty('--fscale', Math.min(1, (innerHeight - 48) / f.h, (innerWidth - 48) / f.w));
  document.getElementById('sbar').classList.toggle('no-notch', !f.notch);
  document.getElementById('hbar').classList.toggle('hidden', !f.sab);
}
function fitViewport(){
  const r = document.documentElement.style;
  if (framed()) { r.removeProperty('--app-h'); r.removeProperty('--vv-top'); applyFrame(); return }
  const vv = window.visualViewport;
  r.setProperty('--app-h', (vv ? vv.height : innerHeight) + 'px');
  r.setProperty('--vv-top', (vv ? vv.offsetTop : 0) + 'px');
}
window.visualViewport?.addEventListener('resize', fitViewport);
window.visualViewport?.addEventListener('scroll', fitViewport);
addEventListener('resize', fitViewport);
fitViewport();

if (S && S.view === 'book' && S.step === 2 && S.draft.date) loadSlots(S.draft.date);
if (S && (S.view === 'success' || S.view === 'order') && !orderById(S.orderId)) S.view = 'tab';
if (S && S.view === 'invoice' && !orderById(S.invoiceId)) S.view = 'invoices';
render();
</script>
</body>
